<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/banana.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2452-clicker REPL</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <!-- <div id="app"></div> -->
  <!-- <script type="module" src="/src/main.ts"></script> -->
  <!-- Include the Repl web component in your page -->

  <script
  src="https://cdn.jsdelivr.net/npm/@electric-sql/pglite-repl/dist-webcomponent/Repl.js"
  type="module"
></script>
  
<pglite-repl id="repl"></pglite-repl>

<script type="module">
  import { PGlite } from 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite/dist/index.js'
  import ddl from './create-tables.sql?raw'

  // Create a PGlite instance
  const pg = new PGlite('idb://2452-clicker')
  pg.exec(ddl);

  // Retrieve the Repl element
  const repl = document.getElementById('repl')

  // REPL to your PGlite instance
  repl.pg = pg
</script>
</body>

</html>
